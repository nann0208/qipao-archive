<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>史料详情 - 海派旗袍史料库</title>
  <link rel="icon" href="assets/logo2.png" type="image/png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- 只读模式自动判断：localhost = false（编辑模式），github.io = true（只读模式） -->
  <script>
    window.READ_ONLY = !location.hostname.includes('localhost') && !location.hostname.includes('127.0.0.1');
  </script>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 13px;">
        <img src="assets/logo2.png" alt="logo" style="height: 37px; width: auto;">
        <h1 class="site-title" style="font-family: '造字工房云川体（非商用）';">海派旗袍史料库</h1>
        <span class="site-subtitle" style="margin-left: 0.4px; font-family:'485-CAI978'">SHANGHAI QIPAO ARCHIVE</span>
      </a>
      <div style="flex: 1;"></div>
      <div class="header-actions">
        <a href="index.html" class="btn-header">← 返回首页</a>
        <span id="local-ai-assistant-entry"></span>
        <a href="add.html" class="btn-header">＋ 添加史料</a>
      </div>
    </div>
  </header>

  <div class="detail-layout">
    <div id="detail-info" class="detail-info">
      <div style="padding: 40px; text-align: center; color: var(--color-text-muted);">加载中...</div>
    </div>
    <div class="resize-handle" id="resize-handle-main"></div>
    <div class="detail-preview">
      <div id="preview-toolbar" class="preview-toolbar">
        <span>原文档案</span>
      </div>
      <div id="preview-area" class="preview-content"></div>
    </div>
  </div>

  <script src="data/data.js"></script>
  <script src="assets/storage.js"></script>
  <script src="assets/detail.js"></script>
  <script>
    // AI 助手只在本机服务中显示；GitHub Pages 不会出现此入口。
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      const mount = document.getElementById('local-ai-assistant-entry');
      if (mount) {
        const link = document.createElement('a');
        link.href = 'ai_assistant.html';
        link.className = 'btn-header';
        link.innerHTML = '<img src="assets/ai-writing-logo.png" alt="" class="ai-button-icon">AI史料助手';
        mount.replaceWith(link);
      }
    }
  </script>
</body>
</html>
