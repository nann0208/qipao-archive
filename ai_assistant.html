  <style>.ai-brand-link{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}.ai-brand-logo{height:37px;width:auto;display:block}.ai-brand-title{font-family:'造字工房云川体（非商用）',"STSong","Songti SC",serif}.ai-brand-subtitle{margin-left:.4px;font-family:'485-CAI978',"PingFang SC",sans-serif}.ai-home-link{margin-left:auto;padding:8px 18px;border:1px solid rgba(255,255,255,.3);border-radius:20px;color:#FAF6F0;text-decoration:none;font-size:13px;transition:background .2s}.ai-home-link:hover{background:rgba(255,255,255,.3)}.rag-page{max-width:980px;margin:34px auto;padding:0 22px}.rag-panel{background:#fff;border:1px solid var(--color-border);border-radius:10px;padding:24px;margin:18px 0;box-shadow:0 2px 8px #2b20100c}.rag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rag-mode{min-height:96px;text-align:left;border:1px solid var(--color-border);border-radius:7px;background:#fff;padding:14px;color:var(--color-text);cursor:pointer}.rag-mode.active{border-color:var(--color-primary);background:#fff8f5}.rag-mode strong{display:block;margin-bottom:6px}.rag-form{display:grid;grid-template-columns:1fr 150px 150px;gap:10px;margin-top:16px}.rag-form textarea{grid-column:1/-1;min-height:100px}.rag-result{white-space:pre-wrap;line-height:1.85}.rag-source{border-top:1px solid var(--color-border);padding:12px 0}.rag-status{color:var(--color-text-muted);font-size:14px}.rag-notice{font-size:13px;color:#76675c;margin-top:10px}@media(max-width:680px){.rag-grid,.rag-form{grid-template-columns:1fr}.rag-form textarea{grid-column:auto}.ai-brand-subtitle{display:none}.ai-home-link{padding:7px 10px;white-space:nowrap}}</style>

<style>
  .rag-page{max-width:1420px}.rag-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:stretch}.ask-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center}.ask-actions .btn{min-width:134px}.analysis-loading{grid-column:1/-1;display:none;align-items:center;justify-content:center;gap:9px;color:#8b2c3c;font-size:14px;font-weight:600;padding:2px 0}.analysis-loading.show{display:flex}.spinner{width:18px;height:18px;border:3px solid #ead2d3;border-top-color:#9e3046;border-radius:50%;animation:ai-spin .8s linear infinite}@keyframes ai-spin{to{transform:rotate(360deg)}}
  .idea-notes{position:static;align-self:stretch;height:auto;max-height:none;box-sizing:border-box;display:flex;flex-direction:column;background:#f5f2ff;border:1px solid #d4cef1;border-radius:10px;overflow:hidden;box-shadow:0 3px 12px #443d7012}.idea-notes-head{display:flex;align-items:center;gap:8px;padding:16px;background:#e2dcfa;border-bottom:1px solid #cbc2ed}.idea-notes-head h2{font-size:18px;margin:0;color:#423a5f}.note-count{margin-left:auto;font-size:12px;color:#746c93}.notes-sync-status{font-size:11px;color:#756b96;white-space:nowrap}.note-backup-actions{display:flex;gap:5px}.note-backup-btn{border:1px solid #bdb3e1;border-radius:4px;background:#f9f7ff;color:#5d527c;padding:3px 6px;font-size:11px;cursor:pointer}.note-backup-btn:hover{background:#fff}.note-list{flex:1;overflow:auto;padding:8px 7px;min-height:132px;max-height:none}.note-empty{padding:20px 12px;color:#7e7694;font-size:13px;line-height:1.7}.note-item{display:block;width:100%;border:0;border-left:3px solid transparent;background:transparent;text-align:left;padding:10px 11px;cursor:pointer;color:#403956;border-radius:4px}.note-item:hover,.note-item.active{background:#fff;border-left-color:#9d8bd7}.note-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}.note-date{display:block;margin-top:3px;color:#89819e;font-size:11px}.note-detail{border-top:1px solid #d4cef1;background:#fff;overflow:auto;padding:15px;min-height:190px;max-height:45vh}.note-detail[hidden]{display:none}.note-detail-title{margin:0 0 9px;font-size:14px;line-height:1.5;color:#423a5f}.note-detail-answer{white-space:pre-wrap;line-height:1.7;font-size:13px;color:#5b536d}.note-detail-actions{display:flex;justify-content:flex-end;margin-top:12px}.note-delete{border:0;background:transparent;color:#957174;font-size:12px;cursor:pointer}.note-delete:hover{text-decoration:underline}.notes-foot{padding:10px 14px;border-top:1px solid #d4cef1;color:#7e7694;font-size:12px;line-height:1.5}
  .query-filters{grid-column:1/-1;display:flex;gap:22px;align-items:flex-start;padding-top:2px}.query-filter{display:flex;align-items:center;gap:9px;min-height:40px}.query-filter strong{white-space:nowrap;font-size:14px}.year-input{width:110px!important}.year-separator{color:var(--color-text-muted);font-size:14px}.topic-picker{position:relative}.topic-trigger{min-width:160px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff}.topic-menu{position:absolute;z-index:20;top:calc(100% + 8px);left:0;width:280px;padding:10px;border:1px solid var(--color-border);border-radius:8px;background:#fff;box-shadow:0 8px 25px #241b1730}.topic-menu[hidden]{display:none}.topic-option{display:block;width:100%;border:0;border-radius:5px;margin:4px 0;padding:9px 11px;text-align:left;font-size:13px;font-weight:600;cursor:pointer;background:var(--topic-color);color:var(--topic-text,#fff)}.topic-option:hover,.topic-option.selected{outline:2px solid #423a5f;outline-offset:1px}.topic-option.all{background:#f7f3ee;color:#4e4843}.topic-option span{opacity:.82;font-weight:400;margin-left:6px}.draft-upload{grid-column:1/-1;padding:13px 14px;border:1px dashed #b9aedd;border-radius:7px;background:#faf8ff}.draft-upload[hidden]{display:none}.draft-upload-label{font-weight:700;font-size:14px}.draft-upload input{display:block;width:100%;margin:10px 0 6px}.draft-upload-hint{font-size:12px;line-height:1.6;color:#766b93}.draft-file-name{font-size:12px;color:#5f557a;font-weight:600}
  .note-title{cursor:pointer}.note-modal{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:#201b2a75}.note-modal[hidden]{display:none}.note-modal-card{width:min(820px,100%);max-height:calc(100vh - 56px);display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:0 18px 48px #170e1d65;overflow:hidden}.note-modal-head{display:flex;align-items:flex-start;gap:14px;padding:20px 24px;background:#e2dcfa;border-bottom:1px solid #cbc2ed}.note-modal-title{margin:0;flex:1;color:#423a5f;font-size:20px;line-height:1.45;cursor:text}.note-modal-tip{display:block;margin-top:5px;color:#756b96;font-size:12px;font-weight:400}.note-modal-close{border:0;background:transparent;color:#5f557a;font-size:26px;line-height:1;cursor:pointer}.note-modal-body{overflow:auto;padding:24px}.note-modal-label{margin:0 0 8px;color:#766b93;font-size:13px;font-weight:700}.note-modal-question,.note-modal-answer{white-space:pre-wrap;line-height:1.85;color:#4b4552}.note-modal-answer{margin-bottom:24px}.note-modal-sources{border-top:1px solid var(--color-border);padding-top:15px}.note-modal-source{padding:8px 0;border-bottom:1px solid #eee8e2;font-size:13px;line-height:1.6}.note-highlight{background:#fff1a8;color:inherit;border-radius:2px;padding:0 1px;box-shadow:inset 0 -1px #e7c940}.highlight-action{position:fixed;z-index:110;border:0;border-radius:6px;background:#52466f;color:#fff;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:0 4px 14px #21183245;cursor:pointer}.highlight-action[hidden]{display:none}.highlight-action:hover{background:#403557}
  @media(max-width:980px){.rag-layout{grid-template-columns:1fr}.idea-notes{position:static;max-height:none}.note-list{max-height:190px}.note-detail{min-height:130px}}@media(max-width:680px){.ask-actions,.analysis-loading{grid-column:auto}.query-filters{align-items:stretch;flex-direction:column;gap:10px}.query-filter{justify-content:flex-start}.year-input{width:100px!important}.topic-menu{width:min(280px,calc(100vw - 88px))}}
</style>

  </a>

</div></header>
<main class="rag-page"><h1><img src="assets/ai-writing-logo.png" alt="" class="ai-secondary-logo">AI 史料助手</h1><p class="page-subtitle">基于本地 PDF、DOCX 与数据库标签检索；回答附带可回查的史料编号。</p>
<div class="rag-layout"><div class="rag-workspace">
<section class="rag-panel"><strong>索引库</strong> <span id="status" class="rag-status">正在检查…</span><button id="build" class="btn" style="margin-left:12px">建立／更新索引</button><label style="margin-left:10px;font-size:13px"><input id="vectors" type="checkbox"> 使用语义向量（需配置 ARK_EMBEDDING_MODEL）</label><div class="rag-notice">扫描版 PDF 若没有可复制文字，需先 OCR；索引过程不会改动原文件或网页数据。</div></section>
<section class="rag-panel"><div class="rag-grid"><button class="rag-mode active" data-mode="ask"><strong>检索并回答</strong>针对一个史实或研究问题找材料、给出有引文标注的回答。</button><button class="rag-mode" data-mode="thesis"><strong>评估论文选题</strong>判断材料支持度、已有优势和关键缺口。</button><button class="rag-mode" data-mode="outline"><strong>生成论证框架</strong>围绕研究问题整理论点、证据和章节建议。</button></div><div class="rag-form"><textarea id="question" class="form-input" placeholder="例如：找出1926年关于旗袍、身体与社会争议的材料，并说明争议的主要理由。"></textarea><div class="query-filters"><div class="query-filter"><strong>时间</strong><input id="year-from" class="form-input year-input" type="number" inputmode="numeric" min="1800" max="2100" placeholder="起始年"><span class="year-separator">至</span><input id="year-to" class="form-input year-input" type="number" inputmode="numeric" min="1800" max="2100" placeholder="结束年"></div><div class="query-filter topic-picker"><strong>议题</strong><button id="topic-trigger" class="btn topic-trigger" type="button" aria-expanded="false"><span id="topic-trigger-text">全部议题</span><span aria-hidden="true">⌄</span></button><div id="topic-menu" class="topic-menu" hidden></div></div></div><div id="draft-upload" class="draft-upload" hidden><div class="draft-upload-label">📎 上传论文草稿（可选）</div><input id="draft-file" type="file" accept=".docx,.txt,.md,text/plain,text/markdown"><div id="draft-file-name" class="draft-file-name"></div><div class="draft-upload-hint">仅在“生成论证框架”中使用。支持 DOCX、TXT、Markdown，最大 5MB；文件只在本次分析中读取，不会保存。</div></div><div class="ask-actions"><button id="ask" class="btn primary">🔍 开始分析</button><button id="clear" class="btn" type="button">🗑️ 清空</button></div><div id="analysis-loading" class="analysis-loading" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>正在检索与分析，请稍候…</span></div></div></section>
<section id="output" class="rag-panel" hidden><h2>研究助手回答</h2><div id="answer" class="rag-result"></div><h3>本次引用史料</h3><div id="sources"></div><div style="margin-top:18px"><button id="save-note" class="btn" type="button">⭐ 存入便签</button></div></section>
</div><aside class="idea-notes" aria-label="灵感便签"><div class="idea-notes-head"><h2>📝 灵感便签</h2><span id="note-count" class="note-count"></span><span id="notes-sync-status" class="notes-sync-status"></span><div class="note-backup-actions"><button id="notes-export" class="note-backup-btn" type="button">导出</button><button id="notes-import" class="note-backup-btn" type="button">导入</button><input id="notes-import-file" type="file" accept="application/json,.json" hidden></div></div><div id="note-list" class="note-list"></div><div class="notes-foot">存入便签后会自动同步到本机文件；“导出”可额外下载便携备份。</div></aside></div></main>
<div id="note-modal" class="note-modal" hidden role="dialog" aria-modal="true" aria-labelledby="note-modal-title"><article class="note-modal-card"><header class="note-modal-head"><h2 id="note-modal-title" class="note-modal-title"></h2><button id="note-modal-close" class="note-modal-close" type="button" aria-label="关闭便签">×</button></header><div id="note-modal-body" class="note-modal-body"></div></article></div><button id="highlight-action" class="highlight-action" type="button" hidden>🟨 高亮选中文字</button>
<script>
  const API='http://127.0.0.1:8765', NOTE_KEY='qipao-ai-idea-notes-v1';
  let mode='ask', selectedNoteId=null;
  const el=id=>document.getElementById(id);
  const escapeHtml=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const TOPICS=[['旗袍流行款式','#8B2C3C'],['性别议题','#C97B89'],['消费生活','#D4B26A','dark'],['轻工业业态','#3E5641'],['国货展览会','#FA855A'],['外贸','#2C3E5C'],['服制条例','#3A78BC'],['服装制作工艺','#A0573B'],['民族国家','#B977CB'],['更名争议','#21AB94']];
  let selectedTopic='';
  function setStatus(text){el('status').textContent=text}
  function renderTopicMenu(){const menu=el('topic-menu');menu.innerHTML=`<button type="button" class="topic-option all ${!selectedTopic?'selected':''}" data-topic="">全部议题</button>`+TOPICS.map(([name,color,tone])=>`<button type="button" class="topic-option ${selectedTopic===name?'selected':''}" data-topic="${name}" style="--topic-color:${color};--topic-text:${tone==='dark'?'#403417':'#fff'}">${name}</button>`).join('');menu.querySelectorAll('.topic-option').forEach(button=>button.addEventListener('click',()=>{selectedTopic=button.dataset.topic;el('topic-trigger-text').textContent=selectedTopic||'全部议题';menu.hidden=true;el('topic-trigger').setAttribute('aria-expanded','false');renderTopicMenu()}))}
  async function refresh(){try{const response=await fetch(API+'/rag/status'),status=await response.json();setStatus(status.indexed?`已索引 ${status.chunks} 个片段${status.vectorized?'（含语义向量）':''}`:'尚未建立索引')}catch{setStatus('本机 AI 服务未连接，请先双击“启动AI服务.bat”')}}
  function loadNotes(){try{return JSON.parse(localStorage.getItem(NOTE_KEY)||'[]')}catch{return[]}}
  function noteUpdatedAt(note){return Date.parse(note.updatedAt||note.createdAt||0)||0}
  function mergeNotes(left,right){const merged=new Map();[...left,...right].forEach(note=>{if(!validImportedNote(note))return;const normalized=normalizeImportedNote(note),existing=merged.get(normalized.id);if(!existing||noteUpdatedAt(normalized)>=noteUpdatedAt(existing))merged.set(normalized.id,normalized)});return [...merged.values()].sort((a,b)=>noteUpdatedAt(b)-noteUpdatedAt(a)).slice(0,100)}
  async function syncNotesToDisk(notes){const status=el('notes-sync-status');status.textContent='同步中…';try{const response=await fetch(API+'/notes/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes})});if(!response.ok)throw Error();status.textContent='已同步'}catch{status.textContent='仅浏览器暂存'}}
  function saveNotes(notes){localStorage.setItem(NOTE_KEY,JSON.stringify(notes));void syncNotesToDisk(notes)}
  async function restoreNotesFromDisk(){try{const response=await fetch(API+'/notes/load');if(!response.ok)throw Error();const payload=await response.json(),remote=Array.isArray(payload.notes)?payload.notes:[],merged=mergeNotes(loadNotes(),remote);localStorage.setItem(NOTE_KEY,JSON.stringify(merged));el('notes-sync-status').textContent=remote.length?'已恢复':'已就绪';renderNotes()}catch{el('notes-sync-status').textContent='仅浏览器暂存'}}
  function backupFileName(){return `灵感便签-${new Date().toISOString().slice(0,10)}.json`}
  function validImportedNote(value){return value&&typeof value==='object'&&typeof value.question==='string'&&typeof value.answer==='string'}
  function normalizeImportedNote(value){return {id:typeof value.id==='string'&&value.id?value.id:`note_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,title:typeof value.title==='string'?value.title:noteTitle(value.question),question:value.question,answer:value.answer,sources:Array.isArray(value.sources)?value.sources:[],highlights:Array.isArray(value.highlights)?value.highlights:[],createdAt:typeof value.createdAt==='string'?value.createdAt:new Date().toISOString(),updatedAt:typeof value.updatedAt==='string'?value.updatedAt:(typeof value.createdAt==='string'?value.createdAt:new Date().toISOString()),mode:typeof value.mode==='string'?value.mode:'ask'}}
  function exportNotes(){const notes=loadNotes(),payload={format:'qipao-ai-idea-notes',version:1,exportedAt:new Date().toISOString(),notes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=backupFileName();document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url)}
  async function importNotes(file){if(!file)return;if(file.size>5*1024*1024)return alert('便签备份文件不能超过 5MB。');try{const parsed=JSON.parse(await file.text()),incoming=Array.isArray(parsed)?parsed:parsed.notes;if(!Array.isArray(incoming)||!incoming.every(validImportedNote))throw Error('格式不正确');const existing=loadNotes(),existingIds=new Set(existing.map(note=>note.id)),added=incoming.filter(validImportedNote).map(normalizeImportedNote).filter(note=>!existingIds.has(note.id)),merged=mergeNotes(existing,added);saveNotes(merged);renderNotes();alert(`已导入 ${added.length} 条便签；重复记录已跳过。`)}catch(error){alert('导入失败：请选择由“导出”功能生成的有效 JSON 文件。')}finally{el('notes-import-file').value=''}}
  function noteTitle(question){return question.replace(/\s+/g,' ').slice(0,24)||'未命名提问'}
  function displayTitle(note){return note.title||noteTitle(note.question)}
  function formatDate(value){return new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(value)).replace(/\//g,'-')}
  let noteClickTimer=null;
  let pendingHighlight=null;
  function highlightedHtml(text,highlights,section){const ranges=(highlights||[]).filter(item=>item.section===section&&Number.isInteger(item.start)&&Number.isInteger(item.end)&&item.start>=0&&item.end>item.start&&item.end<=text.length).sort((a,b)=>a.start-b.start);let html='',cursor=0;ranges.forEach(item=>{if(item.start<cursor)return;html+=escapeHtml(text.slice(cursor,item.start));html+=`<mark class="note-highlight">${escapeHtml(text.slice(item.start,item.end))}</mark>`;cursor=item.end});return html+escapeHtml(text.slice(cursor))}
  function selectionInNote(){const selection=window.getSelection();if(!selection||selection.rangeCount===0||selection.isCollapsed)return null;const range=selection.getRangeAt(0),node=range.commonAncestorContainer.nodeType===Node.ELEMENT_NODE?range.commonAncestorContainer:range.commonAncestorContainer.parentElement,container=node&&node.closest('[data-highlight-section]');if(!container||!el('note-modal-body').contains(container))return null;const section=container.dataset.highlightSection,text=container.textContent||'',before=document.createRange();before.selectNodeContents(container);before.setEnd(range.startContainer,range.startOffset);const start=before.toString().length,end=start+selection.toString().length;if(!selection.toString().trim()||text.slice(start,end)!==selection.toString())return null;return{section,start,end}}
  function hideHighlightAction(){pendingHighlight=null;el('highlight-action').hidden=true}
  function showHighlightAction(){const candidate=selectionInNote();if(!candidate)return hideHighlightAction();pendingHighlight=candidate;const rect=window.getSelection().getRangeAt(0).getBoundingClientRect(),button=el('highlight-action');button.style.left=`${Math.max(12,rect.left)}px`;button.style.top=`${Math.max(12,rect.bottom+8)}px`;button.hidden=false}
  function renameNote(noteId){const notes=loadNotes(),note=notes.find(item=>item.id===noteId);if(!note)return;const title=prompt('修改便签标题：',displayTitle(note));if(title===null)return;const trimmed=title.trim();if(!trimmed)return alert('标题不能为空。');note.title=trimmed;note.updatedAt=new Date().toISOString();saveNotes(notes);renderNotes();if(!el('note-modal').hidden)openNoteModal(noteId)}
  function openNoteModal(noteId){const note=loadNotes().find(item=>item.id===noteId);if(!note)return;hideHighlightAction();selectedNoteId=noteId;renderNotes();el('note-modal-title').innerHTML=`${escapeHtml(displayTitle(note))}<span class="note-modal-tip">双击标题可修改名称 · 拖选文字可高亮</span>`;el('note-modal-body').innerHTML=`<div class="note-modal-label">你的提问</div><div class="note-modal-question" data-highlight-section="question">${highlightedHtml(note.question,note.highlights,'question')}</div><div class="note-modal-label" style="margin-top:24px">AI 回答</div><div class="note-modal-answer" data-highlight-section="answer">${highlightedHtml(note.answer,note.highlights,'answer')}</div><div class="note-modal-sources"><div class="note-modal-label">引用史料</div>${(note.sources||[]).map((source,index)=>`<div class="note-modal-source">[S${index+1}] ${escapeHtml(source.title||'（无题）')}<br>${escapeHtml(source.time||'时间不详')}｜${escapeHtml(source.source||'来源不详')}</div>`).join('')||'<div class="note-modal-source">无可回查史料。</div>'}</div>`;el('note-modal').hidden=false;el('note-modal-close').focus()}
  function closeNoteModal(){hideHighlightAction();el('note-modal').hidden=true}
  function renderNotes(){const notes=loadNotes(),list=el('note-list');el('note-count').textContent=notes.length?`${notes.length} 条`:'暂无';if(!notes.length){list.innerHTML='<div class="note-empty">还没有便签。<br>完成分析后，点击「⭐ 存入便签」即可在这里保存提问与回答。</div>';return}if(!notes.some(note=>note.id===selectedNoteId))selectedNoteId=notes[0].id;list.innerHTML=notes.map(note=>`<button class="note-item ${note.id===selectedNoteId?'active':''}" data-id="${note.id}"><span class="note-title">${escapeHtml(displayTitle(note))}</span><span class="note-date">${formatDate(note.createdAt)}</span></button>`).join('');list.querySelectorAll('.note-item').forEach(button=>{button.addEventListener('click',()=>{clearTimeout(noteClickTimer);const id=button.dataset.id;noteClickTimer=setTimeout(()=>openNoteModal(id),220)});button.addEventListener('dblclick',event=>{event.preventDefault();clearTimeout(noteClickTimer);renameNote(button.dataset.id)})})}
  function saveIdea(question,answer,sources){const notes=loadNotes(),createdAt=new Date().toISOString(),note={id:`note_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,title:noteTitle(question),question,answer,sources,createdAt,updatedAt:createdAt,mode};notes.unshift(note);saveNotes(notes.slice(0,100));selectedNoteId=note.id;renderNotes()}
  function renderSources(sources){el('sources').innerHTML=(sources||[]).map((source,index)=>`<div class="rag-source"><strong>[S${index+1}] ${escapeHtml(source.title||'（无题）')}</strong><br><span>${escapeHtml(source.time||'时间不详')}｜${escapeHtml(source.source||'来源不详')}｜${escapeHtml(source.topics||'')}</span><br><a href="detail.html?id=${encodeURIComponent(source.record_id)}">打开材料 ${escapeHtml(source.record_id)}</a></div>`).join('')||'无可回查史料。'}
  function updateDraftUpload(){el('draft-upload').hidden=mode!=='outline';if(mode!=='outline'){el('draft-file').value='';el('draft-file-name').textContent=''}}
  refresh();renderNotes();renderTopicMenu();restoreNotesFromDisk();
  el('notes-export').onclick=exportNotes;
  el('notes-import').onclick=()=>el('notes-import-file').click();
  el('notes-import-file').addEventListener('change',event=>importNotes(event.target.files[0]));
  el('note-modal-close').onclick=closeNoteModal;
  el('note-modal').addEventListener('click',event=>{if(event.target===el('note-modal'))closeNoteModal()});
  el('note-modal-title').addEventListener('dblclick',()=>{if(selectedNoteId)renameNote(selectedNoteId)});
  el('note-modal-body').addEventListener('mouseup',()=>setTimeout(showHighlightAction,0));
  el('highlight-action').onclick=()=>{if(!pendingHighlight||!selectedNoteId)return;const notes=loadNotes(),note=notes.find(item=>item.id===selectedNoteId);if(!note)return;const overlaps=(note.highlights||[]).some(item=>item.section===pendingHighlight.section&&pendingHighlight.start<item.end&&pendingHighlight.end>item.start);if(overlaps){hideHighlightAction();return alert('这段文字已包含高亮。')}note.highlights=[...(note.highlights||[]),{id:`hl_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,...pendingHighlight}];note.updatedAt=new Date().toISOString();saveNotes(notes);window.getSelection().removeAllRanges();openNoteModal(note.id)};
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!el('note-modal').hidden)closeNoteModal()});
  el('topic-trigger').onclick=event=>{event.stopPropagation();const menu=el('topic-menu'),opening=menu.hidden;menu.hidden=!opening;el('topic-trigger').setAttribute('aria-expanded',String(opening))};
  document.addEventListener('click',event=>{if(!event.target.closest('.topic-picker')){el('topic-menu').hidden=true;el('topic-trigger').setAttribute('aria-expanded','false')}});
  document.querySelectorAll('.rag-mode').forEach(button=>button.onclick=()=>{document.querySelectorAll('.rag-mode').forEach(item=>item.classList.remove('active'));button.classList.add('active');mode=button.dataset.mode;updateDraftUpload()});
  el('build').onclick=async()=>{el('build').disabled=true;setStatus('正在读取 DOCX/PDF 并建立索引，请稍候…');try{const response=await fetch(API+'/rag/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({use_embeddings:el('vectors').checked})}),data=await response.json();if(!response.ok)throw Error(data.detail);setStatus(`已完成：${data.records} 条材料，${data.chunks} 个检索片段${data.vectorized?'，已写入语义向量':''}${data.unreadable_files?`；${data.unreadable_files} 个文件未能提取文字`:''}`)}catch(error){setStatus('索引失败：'+error.message)}finally{el('build').disabled=false}};
  el('draft-file').addEventListener('change',()=>{const file=el('draft-file').files[0];el('draft-file-name').textContent=file?`已选择：${file.name}`:''});
  el('clear').onclick=()=>{el('question').value='';el('year-from').value='';el('year-to').value='';el('draft-file').value='';el('draft-file-name').textContent='';selectedTopic='';el('topic-trigger-text').textContent='全部议题';renderTopicMenu();el('question').focus()};
  let pendingNote=null;
  el('save-note').onclick=()=>{if(!pendingNote)return;saveIdea(pendingNote.question,pendingNote.answer,pendingNote.sources);pendingNote=null;el('save-note').disabled=true;el('save-note').textContent='⭐ 已存入便签'};
  el('ask').onclick=async()=>{const question=el('question').value.trim(),yearFrom=el('year-from').value.trim(),yearTo=el('year-to').value.trim(),draft=el('draft-file').files[0];if(!question)return alert('请输入研究问题。');if(yearFrom&&yearTo&&Number(yearFrom)>Number(yearTo))return alert('起始年份不能晚于结束年份。');if(draft&&draft.size>5*1024*1024)return alert('论文草稿不能超过 5MB。');el('ask').disabled=true;el('clear').disabled=true;el('analysis-loading').classList.add('show');try{let response;if(mode==='outline'&&draft){const form=new FormData();form.append('question',question);form.append('mode',mode);form.append('year_from',yearFrom);form.append('year_to',yearTo);form.append('topic',selectedTopic);form.append('draft',draft);response=await fetch(API+'/rag/ask-with-draft',{method:'POST',body:form})}else{response=await fetch(API+'/rag/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,mode,year_from:yearFrom,year_to:yearTo,topic:selectedTopic})})}const data=await response.json();if(!response.ok)throw Error(data.detail);el('output').hidden=false;el('answer').textContent=data.answer;renderSources(data.sources);pendingNote={question,answer:data.answer,sources:data.sources};el('save-note').disabled=false;el('save-note').textContent='⭐ 存入便签'}catch(error){alert('操作失败：'+error.message)}finally{el('ask').disabled=false;el('clear').disabled=false;el('analysis-loading').classList.remove('show')}};
</script></body></html>
